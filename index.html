<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vendi Demo Board</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #2458c6;
        --ink: #17223a;
        --muted: #445471;
        --canvas: lightpink;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 1rem/1.5 system-ui, sans-serif;
      }
      main { max-width: 47rem; margin: auto; padding: 3rem 1rem; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; color: red; }
      header p { color: var(--muted); }
      section {
        margin-top: 2rem;
        padding: 1.25rem;
        border: 1px solid #d2dcee;
        border-radius: 1rem;
        background: #fff;
      }
      h2 { margin: 0 0 0.75rem; font-size: 1.15rem; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { padding: 0.8rem 0; }
      li + li { border-top: 1px solid #e3e9f3; }
      label { display: flex; gap: 0.75rem; align-items: center; cursor: pointer; }
      input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
      input:checked + span { color: var(--muted); text-decoration: line-through; }
      [role="status"] { margin-bottom: 0; color: var(--accent); font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Hello from Vitthal</h1>
        <p>A small sample project for testing changes in Vendi.</p>
      </header>
      <section aria-labelledby="today">
        <h2 id="today">Before release</h2>
        <ul>
          <li><label><input type="checkbox"><span>Review the homepage copy</span></label></li>
          <li><label><input type="checkbox"><span>Check the mobile layout</span></label></li>
          <li><label><input type="checkbox"><span>Share the preview with the team</span></label></li>
        </ul>
        <p role="status">0 of 3 complete</p>
      </section>
    </main>
    <script>
      const checks = [...document.querySelectorAll("input[type=checkbox]")];
      const status = document.querySelector('[role="status"]');
      function updateProgress() {
        const completed = checks.filter((item) => item.checked).length;
        status.textContent = `${completed} of ${checks.length} complete`;
      }
      checks.forEach((item) => item.addEventListener("change", updateProgress));
      updateProgress();
    </script>
  </body>
</html>
